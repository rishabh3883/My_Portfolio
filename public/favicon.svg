<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#030712" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Main Vibrant Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Drop Shadow & Neon Glow Filters -->
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="24" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Dark Shield Container -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#bgGlow)" stroke="url(#neonGrad)" stroke-width="10" filter="url(#cardShadow)" />

  <!-- Outer Cyber Circuit Hexagon -->
  <polygon points="256,60 425,158 425,354 256,452 87,354 87,158" fill="none" stroke="url(#neonGrad)" stroke-width="12" stroke-linejoin="round" filter="url(#neonBlur)" opacity="0.8" />

  <!-- Corner Circuit Nodes -->
  <circle cx="256" cy="60" r="10" fill="#38bdf8" filter="url(#neonBlur)" />
  <circle cx="425" cy="158" r="10" fill="#818cf8" filter="url(#neonBlur)" />
  <circle cx="425" cy="354" r="10" fill="#c084fc" filter="url(#neonBlur)" />
  <circle cx="256" cy="452" r="10" fill="#f43f5e" filter="url(#neonBlur)" />
  <circle cx="87" cy="354" r="10" fill="#c084fc" filter="url(#neonBlur)" />
  <circle cx="87" cy="158" r="10" fill="#38bdf8" filter="url(#neonBlur)" />

  <!-- Inner Concentric Diamond -->
  <polygon points="256,110 376,256 256,402 136,256" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-dasharray="16 10" opacity="0.6" />

  <!-- Code Slash & Monogram RG -->
  <g filter="url(#neonBlur)">
    <!-- Terminal Prompt / Slash -->
    <line x1="210" y1="320" x2="302" y2="190" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" opacity="0.5" />
    
    <!-- Monogram R G -->
    <text x="256" y="292" text-anchor="middle" font-family="'Outfit', 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="130" fill="url(#neonGrad)" letter-spacing="6">RG</text>
  </g>

  <!-- Tech Dots -->
  <circle cx="185" cy="175" r="7" fill="#38bdf8" />
  <circle cx="327" cy="337" r="7" fill="#f43f5e" />
</svg>